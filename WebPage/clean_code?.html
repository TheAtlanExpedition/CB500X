<!-- symbol moved down relative to Headline text -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camping Expedition</title>
    
    <!-- GOOGLE FONTS LOADING -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
      /* 1. Global Page Layout */
      body { 
        margin: 0; 
        padding: 0 0 20px 0; 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        box-sizing: border-box; 
        background-color: #f5f5f5; 
      }

      /* Typography */
      h2, h3, .handlee-regular { 
        font-family: "Handlee", cursive; 
        font-weight: 400; 
        font-size: 2.5rem; 
      }
      
      p, figcaption, h4 { 
        font-family: "Handlee", cursive; 
        font-weight: 400; 
        font-size: 1.5rem; 
      }
      
      h4 { 
        font-weight: normal; 
      }

      /* Header Containers */
      .header-container { 
        position: sticky; 
        top: 0; 
        z-index: 1000; 
        width: 100%; 
        height: 150px; 
        margin: 0 0 100px 0; 
        background-image: linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.2)), url("https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/tent-at-mountain-landscape-at-sunset-generative-ai-photo.jpg"); 
        background-size: cover; 
        background-position: center; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        box-sizing: border-box; 
      } 
      
      .flex-container { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        width: 100%; 
        max-width: 1900px; 
        padding: 0 20px; 
        box-sizing: border-box; 
      } 

      /* Combined Logo & Brand Layout Group */
      .brand-group { 
        display: flex; 
        align-items: center; 
        gap: 15px; 
        position: relative; 
      } 
      
      .header-container h1 { 
        font-family: "Merriweather", serif; 
        margin: 0; 
        font-size: 4rem; 
        line-height: .9; 
        text-align: left; 
        color: #000000; 
        box-sizing: border-box; 
      }

      /* Anchor Alignment for Navigation Row */
      .nav-buttons-anchored { 
        position: absolute; 
        bottom: -61px; 
        left: 30px; 
        white-space: nowrap; 
      } 

      /* Navigation Buttons Base Styles */
      .nav-btn-home, .nav-btn-camping, .nav-btn-fishing {
        width: 200px;
        height: 60px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 16px;
        color: white;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .nav-btn-home { background-image: url('https://raw.githubusercontent.com/TheAtlanExpedition/CB500X/refs/heads/main/Images/20260704_111639.jpg'); }
      .nav-btn-camping { background-image: url('https://raw.githubusercontent.com/TheAtlanExpedition/CB500X/refs/heads/main/Images/tent-at-mountain-landscape-at-sunset-generative-ai-photo.jpg'); }
      .nav-btn-fishing { background-image: url('https://raw.githubusercontent.com/TheAtlanExpedition/CB500X/refs/heads/main/Images/360_F_723911075_5cpkteKfZw6iVbQNGh294w0EoOCyPMu0.jpg'); }

      .nav-btn-home:hover, .nav-btn-camping:hover, .nav-btn-fishing:hover {
        opacity: 0.9;
        transform: scale(1.15);
      }

      /* Right Side Navigation Menu Group */
      .right-menu {
        display: flex;
        align-items: center;
      }

      .bible-btn { 
        position: relative; 
        border: 2px solid #000000; 
        cursor: pointer; 
        width: 80px;
        height: 100px;
        display: inline-block;
        overflow: hidden; 
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .bible-btn:hover {
        opacity: 0.9;
        transform: scale(1.15);
      }

      .bible-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Story Component Layout */
      .card { 
        width: 100%; 
        max-width: 800px; 
        display: block; 
        padding: 0 20px; 
        box-sizing: border-box; 
      }
      
      .card img.responsive-img { 
        width: calc(100% + 40px); 
        max-width: none; 
        margin-left: -20px; 
        height: auto; 
        display: block; 
        margin-top: 15px; 
      }
    </style>
</head>
<body>

<div class="header-container">
  <div class="flex-container">
    
    <!-- 1. Left Side Group -->
    <div class="brand-group">
      <p style="font-size: 150px; margin: 0;">☈</p>
      <h1 style="transform: translate(25px, 0px);">Camping<br>Expedition</h1>
      
      <!-- 2. Anchored Navigation Row underneath Header Text -->
      <div class="nav-buttons-anchored">
        <a href="index.html"><button class="nav-btn-home">Home</button></a>
        <a href="camping.html"><button class="nav-btn-camping">Camping</button></a>
        <a href="fishing.html"><button class="nav-btn-fishing">Fishing</button></a>
      </div>  
    </div>

    <!-- 3. Right Side Group -->
    <div class="right-menu">
      <a href="bible.html" class="bible-btn">
        <img src="https://raw.githubusercontent.com/TheAtlanExpedition/CB500X/refs/heads/main/Images/photo-1450558415837-1f5e21a17709.avif" alt="Bible Link">
      </a>
    </div>

  </div>
</div>

<!-- Main Body Page Workspace -->
<div class="card">
  <p style="font-size: 100px; text-align: center; margin-top: 50px;">COMING SOON<br>W.I.P</p>
</div>

</body>
</html>
