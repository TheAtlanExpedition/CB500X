<!DOCTYPE html>

      <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap:wght@400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <style>
    /* 1. Global Page Layout */
    body { margin: 0; padding: 0 0 20px 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; background-color: #f5f5f5; }
    /* Font Families */
    h2, h3, .handlee-regular { font-family: "Handlee", cursive; font-weight: 400; font-style: normal; font-size: 2.5rem; }
    p, figcaption, h4, .handlee-regular { font-family: "Handlee", cursive; font-weight: 400; font-style: normal; font-size: 1.5rem; }
    /* THE STICKY BACKGROUND BANNER HEADER - Centers the inner content container track  */
    .header-container { position: sticky; top: 0; z-index: 1000; width: 100%; height: 150px; margin: 0 0 20px 0; background-image: linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.2)), url("https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/360_F_723911075_5cpkteKfZw6iVbQNGh294w0EoOCyPMu0.jpg"); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
    /* Space-between splits the brand layout from the button layout - Pushes brand-group left, button container right - Prevents items from stretching too far apart on wide monitors -  Keeps items away from the glass edges */
    .flex-container { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1900px; padding: 0 20px; box-sizing: border-box; }
    /* Locks the large icon and the title tightly next to each other */
    .brand-group { display: flex; align-items: center; gap: 1px; }
    /* Inner alignment track for text typography */
    .header-container h1 { font-family: "Merriweather", serif; margin: 0; font-size: 4rem; line-height: .9; text-align: left; color: #000000; box-sizing: border-box; }
    h4 { font-weight: normal; }
    /* Responsive story container */
    .card { width: 100%; max-width: 800px; display: block; padding: 0 20px; box-sizing: border-box; }
    /* Forces all story images inside the card to scale responsively */
    .card img.responsive-img { width: calc(100% + 40px); max-width: none; margin-left: -20px; height: auto; display: block; margin-top: 15px; }
    /* Cleaned Button styling */
    .transparent-btn { background-color: rgba(204, 0, 0, 0.8); color: #000000; border: 2px solid #000000; cursor: pointer; text-align: center; font-size: 25px; padding: 10px 10px; width: 80px; height: 100px; }
</style>
</head>
