<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible</title>
    <style>
            /* THE STICKY BACKGROUND BANNER HEADER */
      .header-container {
          position: sticky;       
          top: 0;                 
          z-index: 1000;          
          
          width: 100%;            
          height: 150px;          
          margin: 0 0 20px 0;     
          
          background-image: linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.2)), 
                            url("https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/20260704_111639.jpg");
          background-size: cover;       
          background-position: center;  
          
          display: flex;          
          align-items: center;    
          justify-content: center; /* Centers the inner content container track */
          box-sizing: border-box;
      }
            /* Space-between splits the brand layout from the button layout */
      .flex-container {
          display: flex;
          align-items: center; 
          justify-content: space-between; /* Pushes brand-group left, button container right */
          width: 100%;
          max-width: 1900px;              /* Prevents items from stretching too far apart on wide monitors */
          padding: 0 20px;                /* Keeps items beautifully away from the glass edges */
          box-sizing: border-box;
      }

      /* Locks the large icon and the title tightly next to each other */
      .brand-group {
          display: flex;
          align-items: center;
          gap: 15px;                      /* Changes space between icon and text */
      }
              /* 1. Global Page Layout */
      body {
          margin: 0;
          padding: 0 0 20px 0; 
          min-height: 100vh;
          display: flex;
          flex-direction: column; 
          align-items: center;
          box-sizing: border-box;
          background-color: #f5f5f5;
      }
      /* Cleaned Button styling */
      .transparent-btn {
          background-color: rgba(204, 0, 0, 0.8); 
          color: #000000;                     
          border: 2px solid #000000;     
          cursor: pointer;              
          text-align: center;
          font-size: 25px;  
          padding: 15px 10px;            
          width: 90px;             
          height: 110px;  
          line-height: .8;               
      }
    </style>
</head>
<body>
    

        <div class="header-container">
          <div class="flex-container">
            <div class="brand-group">
              <h1>Lessons From<br>The Bible ✟</h1>
            </div>
                  <!-- 2. Right Side Group (The button gets automatically cast out to the edge) -->
              <div> 
              <a href="index.html"><Button 
              class="transparent-btn" style="font-size:50px;">☈<p style="font-size:15px;">Home Page</p></Button></a>
            </div>
          </div>
        </div>
            <p style="font-size:150px;">COMING SOON</p>
</body>
</html>
