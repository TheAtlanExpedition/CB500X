<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bible</title>
    <style>
      /* 1. Global Page Layout */
      body { margin: 0; padding: 0 0 20px 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; background-color: #f5f5f5; }
      /* THE STICKY BACKGROUND BANNER HEADER */
      .header-container { position: sticky; top: 0; z-index: 1000; width: 100%; height: 150px; margin: 0 0 20px 0; background-image: linear-gradient(rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.2)), url("https://raw.githubusercontent.com/TheAtlanExpedition/CB500X-Adventures/refs/heads/main/Images/the-holy-bible-with-sun-beam-website-header.jpg"); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
      /* Space-between splits the brand layout from the button layout */
      .flex-container { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 1900px; padding: 0 20px; box-sizing: border-box; }
      /* Locks the large icon and the title tightly next to each other */
      .brand-group { display: flex; align-items: center; gap: 15px; }
      .brand-icon { font-size: 150px; transform: translateY(-10px); margin: 0; }
      /* Inner alignment track for text typography - FORCES text to stay on its intended lines */
      .header-container h1 { font-family: "Merriweather", serif; margin: 0; font-size: 60px; line-height: .9; text-align: left; color: #000000; box-sizing: border-box; white-space: nowrap; }
      /* Cleaned Button styling */
      .transparent-btn { background-color: rgba(204, 0, 0, 0.8); color: #000000; border: 2px solid #000000; cursor: pointer; text-align: center; font-size: 45px;  /* Moved from inline HTML */ padding: 15px 10px; width: 80px; height: 100px; line-height: .8; }
      .btn-text { font-size: 15px; margin: 0; }
    </style>
</head>

<body>

    <div class="header-container">
      <div class="flex-container">
        <!-- 1. Left Side Group (Text & Logo remain neatly joined) -->
        <div class="brand-group">
          <p class="brand-icon">✟</p>
          <h1 style="font-size:75px;">Lessons From<br>The Bible</h1>
        </div>
        <!-- 2. Right Side Group (The button gets automatically cast out to the edge) -->
        <div> 
          <a href="index.html" style="text-decoration: none; color: #000000;">
            <button class="transparent-btn">
              ☈<p class="btn-text">Home Page</p>
            </button>
          </a>
        </div>
      </div>
    </div>

    <p style="font-size:100px; text-align:center">COMING SOON<br>W.I.P</p>
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>✟
</body>
</html>
